<meta name="color-scheme" content="dark">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;color:#e6edf3;
    background:radial-gradient(900px 520px at 50% -10%,#17253c 0%,transparent 65%),
               radial-gradient(700px 420px at 85% 110%,#241a3a 0%,transparent 60%),#0d1117;
    font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
  }
  main{width:min(640px,100%)}
  .card{
    border:1px solid #30363d;border-radius:18px;padding:32px;
    background:linear-gradient(180deg,#131a24,#0d1117);
    box-shadow:0 40px 80px -40px #000;
  }
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.5px}
  h1 span{background:linear-gradient(90deg,#58a6ff,#a371f7,#3fb950);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0 0 24px;color:#8b949e;font-size:13px;line-height:1.7}
  .links{display:grid;gap:10px}
  a{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;border:1px solid #30363d;border-radius:12px;
    color:#e6edf3;text-decoration:none;font-size:13px;background:#0f151d;
    transition:border-color .15s,transform .15s,background .15s;
  }
  a:hover{border-color:#58a6ff;background:#111a26;transform:translateY(-1px)}
  a b{font-weight:600}
  a small{color:#8b949e;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:10px;vertical-align:1px}
  .d1{background:#58a6ff}.d2{background:#a371f7}.d3{background:#3fb950}.d4{background:#f0883e}
  footer{margin-top:18px;text-align:center;color:#6e7681;font-size:11px;letter-spacing:.18em}
</style>
</head>
<body>
